name: Repair Prestige portrait asset

on:
  push:
    branches: [main]
    paths:
      - '.portrait-repair/READY'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild original portrait
        shell: bash
        run: |
          cat .portrait-repair/p00 .portrait-repair/p01 .portrait-repair/p02 .portrait-repair/p03 | base64 -d > assets/portrait.webp
          test "$(git hash-object assets/portrait.webp)" = "7cf2130ca9c60734399d324ad997b24e529cf1da"
      - name: Commit repaired portrait
        shell: bash
        run: |
          rm -rf .portrait-repair
          rm -f .github/workflows/repair-portrait.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restore original Prestige portrait asset'
          git push origin HEAD:main
