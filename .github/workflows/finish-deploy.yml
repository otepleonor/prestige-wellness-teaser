name: Finish Prestige Wellness deployment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finish-deploy.yml'
      - '.bootstrap/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reassemble deployment archive
        shell: bash
        run: |
          cat .bootstrap/chunk* | base64 -d > /tmp/prestige-deploy.zip
          unzip -t /tmp/prestige-deploy.zip
      - name: Replace repository root with deployment package
        shell: bash
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          unzip -o /tmp/prestige-deploy.zip -d .
          touch .nojekyll
      - name: Commit deployed site
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Deploy complete Prestige Wellness teaser package'
          git push origin HEAD:main
