name: Enable GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enable-pages.yml'

permissions:
  contents: read
  pages: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Enable Pages from main branch root
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          payload='{"source":{"branch":"main","path":"/"}}'
          code=$(curl -sS -o /tmp/pages-create.json -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/pages" \
            -d "$payload")
          if [[ "$code" == "201" ]]; then
            cat /tmp/pages-create.json
            exit 0
          fi
          if [[ "$code" == "409" || "$code" == "422" ]]; then
            code=$(curl -sS -o /tmp/pages-update.json -w '%{http_code}' \
              -X PUT \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/pages" \
              -d "$payload")
            cat /tmp/pages-update.json
            [[ "$code" == "204" ]]
            exit
          fi
          cat /tmp/pages-create.json
          echo "GitHub Pages API returned HTTP ${code}" >&2
          exit 1
