name: Finalize Prestige Wellness deployment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-deploy.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Finalize repository root
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .bootstrap/payload2000 ]]; then
            cat .bootstrap/payload20* | base64 -d > /tmp/prestige-deploy.zip
            unzip -t /tmp/prestige-deploy.zip
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            unzip -o /tmp/prestige-deploy.zip -d .
            touch .nojekyll
          else
            rm -f .github/workflows/finalize-deploy.yml .github/workflows/enable-pages.yml
            rmdir .github/workflows 2>/dev/null || true
            rmdir .github 2>/dev/null || true
          fi
      - name: Commit final repository state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Finalize complete Prestige Wellness teaser deployment'
          git push origin HEAD:main
